events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 1. Nhận HTTP từ Nginx Host (Port 81) cho Frontend (React)
    server {
        listen 80 default_server;
        server_name web.chausu.name.vn chausu.name.vn _;

        location / {
            proxy_pass http://jobportal-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Hỗ trợ WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 2. Nhận HTTP từ Nginx Host (Port 81) cho Backend API (Spring Boot)
    server {
        listen 80;
        server_name api.chausu.name.vn;

        location / {
            proxy_pass http://jobportal-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # 3. Khối SSL nội bộ nếu gọi trực tiếp cổng 8443 (Frontend)
    server {
        listen 443 ssl;
        server_name web.chausu.name.vn chausu.name.vn;

        ssl_certificate     /etc/nginx/certs/chausu.crt;
        ssl_certificate_key /etc/nginx/certs/chausu.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://jobportal-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # 4. Khối SSL nội bộ nếu gọi trực tiếp cổng 8443 (Backend)
    server {
        listen 443 ssl;
        server_name api.chausu.name.vn;

        ssl_certificate     /etc/nginx/certs/chausu.crt;
        ssl_certificate_key /etc/nginx/certs/chausu.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://jobportal-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}