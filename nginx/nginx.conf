events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tối ưu truyền tải
    sendfile        on;
    keepalive_timeout  65;

    # 1. Chuyển hướng toàn bộ traffic HTTP (cổng 80) sang HTTPS
    server {
        listen 80;
        server_name web.chausu.name.vn chausu.name.vn api.chausu.name.vn;
        return 301 https://$host$request_uri;
    }

    # 2. Khối server định tuyến cho Frontend (React)
    server {
        listen 443 ssl;
        server_name web.chausu.name.vn chausu.name.vn;

        ssl_certificate /etc/nginx/certs/chausu.crt;
        ssl_certificate_key /etc/nginx/certs/chausu.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://frontend-container:80; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hỗ trợ WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 3. Khối server định tuyến cho Backend API (Spring Boot)
    server {
        listen 443 ssl;
        server_name api.chausu.name.vn;

        ssl_certificate /etc/nginx/certs/chausu.crt;
        ssl_certificate_key /etc/nginx/certs/chausu.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend-container:8080; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}