name: Deploy web app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # =========================================
  # STAGE 1: CI - BUILD & PUSH DOCKER IMAGES
  # =========================================
  Build-and-Push:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1/ Backend Image
      - name: Build And Push Backend Image (Java Spring Boot)
        uses: docker/build-push-action@v5
        with:
          context: ./jobportal
          file: ./jobportal/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/jobportal-backend:${{ github.sha }}

      # 2/ Frontend Image
      - name: Build And Push Frontend Image (Reactjs)
        uses: docker/build-push-action@v5
        with:
          context: ./react-social
          file: ./react-social/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/jobportal-frontend:${{ github.sha }}

 # ========================================================
  # STAGE 2A: CD CHO KUBERNETES & GITOPS (ARGOCD TỰ SYNC)
  # ========================================================
  Update-K8s-Manifest:
    runs-on: ubuntu-latest
    needs: Build-and-Push
    if: github.event_name == 'push'

    steps:
      - name: Checkout and Update Manifest in Repo 2
        run: |
          # 1. Cấu hình danh tính Git Bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Clone Repo 2 (k8s manifest) bằng PAT Token đã cấp quyền repo
          git clone https://x-access-token:${{ secrets.AUTO_DEPLOY_TOKEN }}@github.com/ChauSu36/k8s-searching-job-portal.git manifest-repo
          cd manifest-repo

          # 3. Dùng lệnh sed tự động thay đổi Image Tag cho Frontend & Backend
          sed -i 's|image: .*/jobportal-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/jobportal-frontend:'${{ github.sha }}'|g' Frontend/deployment.yaml
          sed -i 's|image: .*/jobportal-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/jobportal-backend:'${{ github.sha }}'|g' Backend/deployment.yaml

          # 4. Commit và Push ngược lại lên nhánh main của Repo 2
          git add Frontend/deployment.yaml Backend/deployment.yaml
          git commit -m "ci: auto-update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main

  # ========================================================
  # STAGE 2B: CD CHO SERVER DOCKER CŨ (NẾU VẪN MUỐN DUY TRÌ)
  # ========================================================
  Deploy-on-server:
    runs-on: ubuntu-latest
    needs: Build-and-Push
    if: github.event_name == 'push'

    steps:
      - name: SSH and run deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/chausu-compose-web/Deploy-web-ssearching-job-portal

            git pull origin main
            export IMAGE_TAG=${{ github.sha }}

            echo "Pulling the latest images from Docker Hub....."
            docker compose pull
            
            echo "Restarting containers..."
            docker compose up -d --no-build

            echo "Reloading Nginx configuration..."
            docker compose exec -T nginx nginx -s reload || docker compose restart nginx

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Check containers..."
            docker compose ps

            echo "Deployment completed."
      
