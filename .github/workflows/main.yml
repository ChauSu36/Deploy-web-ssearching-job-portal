name: Build and Push Container Images to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./jobportal
          file: ./jobportal/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jobportal-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/jobportal-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./react-social
          file: ./react-social/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jobportal-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/jobportal-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup Git Identity for GitHub Actions Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone K8s Manifest Repo
        run: |
          git clone https://x-access-token:${{ secrets.AUTO_DEPLOY_TOKEN }}@github.com/ChauSu36/hybrid-cloud-k8s-manifests.git manifest-repo

      - name: Update Manifests
        run: |
          cd manifest-repo
          # Cố định tiền tố chausu/ để ngăn lỗi rỗng biến làm hỏng ArgoCD
          sed -i 's|image: .*/jobportal-backend:.*|image: chausu/jobportal-backend:${{ github.sha }}|g' openstack-onpremise/Backend/deployment.yaml
          sed -i 's|image: .*/jobportal-frontend:.*|image: chausu/jobportal-frontend:${{ github.sha }}|g' openstack-onpremise/Frontend/deployment.yaml

      - name: Commit and Push Changes back to K8s Repo
        run: |
          cd manifest-repo
          git add openstack-onpremise/Backend/deployment.yaml openstack-onpremise/Frontend/deployment.yaml
          git commit -m "ci: gitops sync - auto update images to ${{ github.sha }} [skip ci]" || echo "No manifest changes to commit"
          git push origin main