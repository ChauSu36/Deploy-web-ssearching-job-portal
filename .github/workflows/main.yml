name: Build and Push Container Images to Docker Hub

on:
  push:
    branches: [ "main" ]
    # Chỉ trigger khi có commit thay đổi code trong jobportal hoặc react-social
    paths:
      - 'jobportal/**'
      - 'react-social/**'
  # Cho phép kích hoạt thủ công từ giao diện Actions khi cần test
  workflow_dispatch:

jobs:
  # Job 1: Kiểm tra thư mục nào có thay đổi
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'jobportal/**'
            frontend:
              - 'react-social/**'

  # Job 2: Build và Push Backend Image (Spring Boot)
  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./jobportal
          file: ./jobportal/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobportal-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobportal-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Build và Push Frontend Image (React)
  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./react-social
          file: ./react-social/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobportal-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobportal-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# JOB 4: TỰ ĐỘNG CẬP NHẬT TAG VÀO REPO K8S MANIFEST
update-manifests:
    # Đảm bảo chỉ chạy job này NẾU các quá trình build/push bên trên chạy xong hoặc bị skip (nhưng không được failed)
    # always() giúp job này vẫn chạy dù backend hoặc frontend không build (do không có file bị sửa theo path filter)
    if: always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success' || needs.build-backend.result == 'skipped' || needs.build-frontend.result == 'skipped')
    needs: [build-backend, build-frontend, changes]
    runs-on: ubuntu-latest

    steps:
      - name: Setup Git Identity for GitHub Actions Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone K8s Manifest Repo
        run: |
          # Dùng Token PAT đã lưu (AUTO_DEPLOY_TOKEN) để clone Repo 2
          git clone https://x-access-token:${{ secrets.AUTO_DEPLOY_TOKEN }}@github.com/ChauSu36/k8s-searching-job-portal.git manifest-repo

      - name: Update Backend Manifest (Nếu Backend có thay đổi)
        if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          cd manifest-repo
          # Dùng `sed` cập nhật trực tiếp tag mới nhất vào file deployment.yaml của thư mục Backend
          sed -i 's|image: .*/jobportal-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/jobportal-backend:${{ github.sha }}|g' 03-backend/deployment.yaml

      - name: Update Frontend Manifest (Nếu Frontend có thay đổi)
        if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          cd manifest-repo
          # Dùng `sed` cập nhật trực tiếp tag mới nhất vào file deployment.yaml của thư mục Frontend
          sed -i 's|image: .*/jobportal-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/jobportal-frontend:${{ github.sha }}|g' 04-frontend/deployment.yaml

      - name: Commit and Push Changes back to K8s Repo
        run: |
          cd manifest-repo
          # Git add và commit. Dùng `|| echo` để pipeline không báo lỗi đỏ nếu không có file nào bị thay đổi
          git add 03-backend/deployment.yaml 04-frontend/deployment.yaml
          git commit -m "ci: gitops sync - auto update images to ${{ github.sha }} [skip ci]" || echo "No manifest changes to commit"
          git push origin main